# =============================================================================
# Self-contained stack for the Smart Substitution Engine AI service.
#
#   docker compose up --build
#
# Services:
#   etcd / minio / milvus  - Milvus standalone vector DB (product embeddings)
#   attu                   - Milvus web UI            -> http://localhost:8002
#   ollama / ollama-init   - local LLM (text gen); auto-pulls qwen3.5:0.8b
#   ai-service             - FastAPI + LangGraph + sentence-transformers (bge-m3, CPU)
#   ui                     - Streamlit demo UI       -> http://localhost:8501
#
# The .NET backend (other engineer) is NOT included here - it calls this service
# at http://localhost:8000 (see INTEGRATION.md). Heavy stack (~6GB RAM); the
# first start downloads models + images.
# =============================================================================
# docker compose up --build -d
# docker compose logs -f ai-service
# docker compose down -v

services:
  # ---------------- Milvus standalone (vector DB) ----------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: sse-milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: sse-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.17
    container_name: sse-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      start_period: 90s
      timeout: 20s
      retries: 6
    ports:
      - "19530:19530"   # gRPC (pymilvus)
      - "9091:9091"     # health/metrics
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  attu:
    image: zilliz/attu:latest
    container_name: sse-milvus-attu
    environment:
      - MILVUS_URL=milvus:19530
    ports:
      - "8002:3000"
    depends_on:
      - milvus
    restart: unless-stopped

  # ---------------- Ollama (text generation) ----------------
  ollama:
    image: ollama/ollama:latest
    container_name: sse-ollama
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: sse-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull qwen3.5:0.8b"]
    restart: "no"

  # ---------------- AI recommendation service ----------------
  ai-service:
    build:
      context: ./ai-service
      args:
        PRELOAD_EMBEDDING_MODEL: "false"
    image: sse-ai:latest
    container_name: sse-ai
    depends_on:
      ollama:
        condition: service_healthy
      milvus:
        condition: service_healthy
    environment:
      - SSE_OLLAMA_BASE_URL=http://ollama:11434
      - SSE_CHAT_MODEL=qwen3.5:0.8b
      - SSE_EMBEDDING_BACKEND=sentence_transformers
      - SSE_EMBEDDING_MODEL=BAAI/bge-m3
      - SSE_EMBEDDING_DEVICE=cpu
      - SSE_ENABLE_MILVUS=true
      - SSE_MILVUS_URI=http://milvus:19530
      - SSE_MILVUS_COLLECTION=product_embeddings
      # Direct Atlas access powers the chatbot's catalog lookups (same
      # connection string the .NET backend uses). Empty -> chat catalog features
      # degrade gracefully; the rest of the service is unaffected.
      - SSE_MONGO_URI=${MONGODB_CONNECTION_STRING}
      - SSE_MONGO_DB=hackathon_db
      - HF_HOME=/cache/huggingface
    volumes:
      - hf-cache:/cache/huggingface
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s
    restart: unless-stopped

  # ---------------- .NET backend API ----------------
  backend:
    build:
      context: ./backend/SmartSubstitution.Api
    image: sse-backend:latest
    container_name: sse-backend
    depends_on:
      ai-service:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - MongoDB__ConnectionString=${MONGODB_CONNECTION_STRING}
      - MongoDB__DatabaseName=hackathon_db
      - PythonAiService__BaseUrl=http://ai-service:8000
      - PythonAiService__TimeoutSeconds=120
      - LocalMongoDB__ConnectionString=${LOCAL_MONGODB_CONNECTION_STRING}
      - LocalMongoDB__DatabaseName=${LOCAL_MONGODB_DATABASE_NAME}
      - LocalMongoDB__CollectionName=${LOCAL_MONGODB_COLLECTION_NAME}
    ports:
      - "8080:8080"
    restart: unless-stopped

  # ---------------- Streamlit demo UI ----------------
  ui:
    build:
      context: ./ui
    image: sse-ui:latest
    container_name: sse-ui
    depends_on:
      ai-service:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      - AI_SERVICE_URL=http://ai-service:8000
      - BACKEND_URL=http://backend:8080
      # Browser-reachable URL for the embedded chat widget (loaded by the
      # user's browser, not from inside the container network).
      - AI_PUBLIC_URL=http://localhost:8000
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  etcd-data:
  minio-data:
  milvus-data:
  ollama-models:
  hf-cache:

# -----------------------------------------------------------------------------
# GPU note: this stack uses CPU PyTorch for portability. For GPU embeddings,
# build the image against a CUDA torch wheel and add to ai-service:
#   deploy:
#     resources:
#       reservations:
#         devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]
# plus set SSE_EMBEDDING_DEVICE=cuda. Requires the NVIDIA Container Toolkit.
# -----------------------------------------------------------------------------
