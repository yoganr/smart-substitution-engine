[server]
headless = true
address = "0.0.0.0"
port = 8501

[browser]
gatherUsageStats = false

[client]
# Hide the "Deploy" button + developer menu for a clean, product-like UI.
toolbarMode = "minimal"

[theme]
base = "light"
# cisbox forest green - drives native widgets (primary button, slider, toggle,
# tab underline, focus ring). Custom CSS in app.py re-themes everything else.
primaryColor = "#215B33"
